services:
  - type: web
    name: curious-lead-intelligence
    runtime: node
    plan: free # 100% Free - No credit card / payment info required
    region: oregon
    buildCommand: npm install && node db/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEWSAPI_AI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: SECURE_COOKIES
        value: "true"
      - key: TZ_NAME
        value: Asia/Kolkata
      - key: CRON_SCHEDULE
        value: "0 2,14 * * *"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: Admin
